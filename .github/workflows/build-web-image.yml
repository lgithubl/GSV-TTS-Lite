name: Build Web Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "gsv_tts/**"
      - "docker/**"
      - "Dockerfile.web"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/build-web-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: m40
      torch_version:
        description: PyTorch version
        required: false
        default: "2.5.1"
      torchaudio_version:
        description: torchaudio version matching PyTorch
        required: false
        default: "2.5.1"
      pytorch_index_url:
        description: PyTorch wheel index URL. cu118 is friendlier to Tesla M40 than CPU wheels or newer CUDA defaults.
        required: false
        default: https://download.pytorch.org/whl/cu118
      export_artifact:
        description: Export image tar.gz artifact
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  build-web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="web"; fi
          TORCH_VERSION="${{ inputs.torch_version }}"
          if [ -z "$TORCH_VERSION" ]; then TORCH_VERSION="2.5.1"; fi
          TORCHAUDIO_VERSION="${{ inputs.torchaudio_version }}"
          if [ -z "$TORCHAUDIO_VERSION" ]; then TORCHAUDIO_VERSION="2.5.1"; fi
          PYTORCH_INDEX_URL="${{ inputs.pytorch_index_url }}"
          if [ -z "$PYTORCH_INDEX_URL" ]; then PYTORCH_INDEX_URL="https://download.pytorch.org/whl/cu118"; fi
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=gsv-tts-lite-web-${TAG}" >> "$GITHUB_OUTPUT"
          echo "torch_version=$TORCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "torchaudio_version=$TORCHAUDIO_VERSION" >> "$GITHUB_OUTPUT"
          echo "pytorch_index_url=$PYTORCH_INDEX_URL" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            TORCH_VERSION=${{ steps.image.outputs.torch_version }}
            TORCHAUDIO_VERSION=${{ steps.image.outputs.torchaudio_version }}
            PYTORCH_INDEX_URL=${{ steps.image.outputs.pytorch_index_url }}

      - name: Smoke test pushed image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "${{ steps.image.outputs.image }}"
          docker run -d --name gsv-tts-web-smoke -p 8000:8000 "${{ steps.image.outputs.image }}"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"ok":true'; then
              curl -fsS http://127.0.0.1:8000/ | grep -q 'GSV-TTS-Lite'
              docker rm -f gsv-tts-web-smoke
              exit 0
            fi
            docker logs --tail 80 gsv-tts-web-smoke || true
            sleep 2
          done
          docker logs gsv-tts-web-smoke || true
          docker rm -f gsv-tts-web-smoke || true
          exit 1

      - name: Validate M40 image contract without GPU
        shell: bash
        run: |
          set -euxo pipefail
          docker image inspect "${{ steps.image.outputs.image }}" \
            --format '{{ index .Config.Labels "ai.lgithubl.pytorch.index_url" }}' \
            | grep -q '/cu118'
          docker image inspect "${{ steps.image.outputs.image }}" \
            --format '{{ index .Config.Labels "ai.lgithubl.m40.expected_compute_capability" }}' \
            | grep -qx "5.2"
          grep -R "sm_version < 5.2" gsv_tts/Config.py
          docker run --rm --entrypoint python "${{ steps.image.outputs.image }}" - <<'PY'
          import importlib.metadata
          import torch

          assert torch.__version__.startswith("${{ steps.image.outputs.torch_version }}"), torch.__version__
          assert importlib.metadata.version("torchaudio").startswith("${{ steps.image.outputs.torchaudio_version }}")
          assert torch.version.cuda is not None, "CPU-only torch wheel installed"
          assert torch.version.cuda.startswith("11.8"), torch.version.cuda
          assert torch.cuda.is_available() is False
          print("torch", torch.__version__)
          print("torch cuda", torch.version.cuda)
          PY

      - name: Write image summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Docker image

          Published image:

          \`\`\`text
          ${{ steps.image.outputs.image }}
          \`\`\`

          Pull it with:

          \`\`\`bash
          docker pull ${{ steps.image.outputs.image }}
          \`\`\`
          EOF

      - name: Export image tarball
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker save "${{ steps.image.outputs.image }}" | gzip -1 > "${{ steps.image.outputs.artifact_name }}.tar.gz"

      - name: Upload image artifact
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.image.outputs.artifact_name }}
          path: ${{ steps.image.outputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Write local image artifact summary
        if: ${{ github.event_name == 'push' || inputs.export_artifact == 'true' }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Local Docker image artifact

          Download the artifact named \`${{ steps.image.outputs.artifact_name }}\` from this workflow run.

          The downloaded zip contains:

          \`\`\`text
          ${{ steps.image.outputs.artifact_name }}.tar.gz
          \`\`\`

          Load it locally with:

          \`\`\`bash
          gzip -dc ${{ steps.image.outputs.artifact_name }}.tar.gz | docker load
          docker image inspect ${{ steps.image.outputs.image }}
          \`\`\`
          EOF

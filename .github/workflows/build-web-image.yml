name: Build Web Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "gsv_tts/**"
      - "docker/**"
      - "Dockerfile.web"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/build-web-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: web
      export_artifact:
        description: Export image tar.gz artifact
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  build-web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="web"; fi
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=gsv-tts-lite-web-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Smoke test pushed image
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker run -d --name gsv-tts-web-smoke -p 8000:8000 "${{ steps.image.outputs.image }}"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"ok":true'; then
              curl -fsS http://127.0.0.1:8000/ | grep -q 'GSV-TTS-Lite'
              docker rm -f gsv-tts-web-smoke
              exit 0
            fi
            docker logs --tail 80 gsv-tts-web-smoke || true
            sleep 2
          done
          docker logs gsv-tts-web-smoke || true
          docker rm -f gsv-tts-web-smoke || true
          exit 1

      - name: Export image tarball
        if: inputs.export_artifact != 'false'
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker save "${{ steps.image.outputs.image }}" | gzip -1 > "${{ steps.image.outputs.artifact_name }}.tar.gz"

      - name: Upload image artifact
        if: inputs.export_artifact != 'false'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.image.outputs.artifact_name }}
          path: ${{ steps.image.outputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
